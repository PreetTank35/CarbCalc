name: Build CarbCalc Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html calculator.html dashboard.html results.html heal.html circle.html studio.html three.min.js styles.css app.js sw.js manifest.webmanifest icon.svg "researched by anti gravity" www/

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Stage APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/CarbCalc-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarbCalc-Android-Debug
          path: release-output/CarbCalc-Android.apk
          retention-days: 90

      - name: Release Latest Android APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "CarbCalc Latest Android App Build"
          body: |
            ### 🌿 CarbCalc Android Application
            Automated production debug build of CarbCalc Eco Companion.
            
            - **Package**: `in.edu.mitaoe.carbcalc`
            - **Platform**: Android 7.0+ (API 24+)
            - **Features**: Offline calculations, 3D Earth, Scope 1-3 youth framework, PM Surya Ghar solar planner.
            
            #### How to Install:
            1. Download `CarbCalc-Android.apk` below.
            2. If Android displays *"File might be harmful"*, tap **Download anyway**.
            3. Tap the file in your notification bar or Downloads folder to install.
            4. If prompted, toggle on **Allow from this source** in Settings.
          files: release-output/CarbCalc-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
